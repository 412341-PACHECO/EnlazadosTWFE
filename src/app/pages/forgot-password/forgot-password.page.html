<ion-content [fullscreen]="true" class="forgot-content">
  <section class="forgot-shell">
    <div class="forgot-brand">
      <div class="forgot-brand__badge">
        <ion-icon name="heart"></ion-icon>
      </div>
      <h1>Recuperar Contrasena</h1>
      <p>Te enviaremos un enlace para generar una nueva contrasena</p>
    </div>

    <div class="forgot-card">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <h2>Olvide mi contrasena</h2>

        <div class="field-group">
          <label for="email">Correo Electronico</label>
          <div class="input-shell" [class.input-shell--error]="hasControlError()">
            <ion-icon name="mail-outline"></ion-icon>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="tu@email.com"
              autocomplete="email"
            />
          </div>
          @if (hasControlError()) {
            <p class="field-error">{{ getControlErrorMessage() }}</p>
          }
        </div>

        @if (submitError) {
          <p class="submit-message submit-message--error">{{ submitError }}</p>
        }

        @if (submitSuccess) {
          <p class="submit-message submit-message--success">{{ submitSuccess }}</p>
        }

        <button class="submit-button" type="submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <ion-spinner name="crescent"></ion-spinner>
            <span>Enviando...</span>
          } @else {
            <span>Enviar enlace</span>
          }
        </button>
      </form>

      <a class="back-link" routerLink="/login">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Volver a iniciar sesion</span>
      </a>
    </div>
  </section>
</ion-content>
